server:
  host: "0.0.0.0"
  port: 3000
  base_url: __PUBLIC_URL__
  cookie_secret: __COOKIE_SECRET__
  cookie_secure: true
  cookie_max_age: 86400
  data_path: "/var/lib/headplane"
headscale:
  url: "http://127.0.0.1:8080"
  public_url: __PUBLIC_URL__
  config_path: "/etc/headscale/config.yaml"
  api_key_path: "/var/lib/headplane/headscale-api.key"
integration:
  agent:
    enabled: false
  docker:
    enabled: false
  kubernetes:
    enabled: false
    pod_name: "headscale"
  proc:
    enabled: false
