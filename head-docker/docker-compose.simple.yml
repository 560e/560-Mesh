# 560-Mesh：填写域名、宿主端口和管理员账号密码后，直接启动。
# 修改本区参数，然后执行 docker-compose up -d。
# public_url是浏览器访问的HTTPS地址；两个port是本机反代后端端口。
# 不安装、修改、重载或重启Nginx；HTTPS反代由你手工配置。
name: 560-mesh

x-settings:
  image: &image "zhangxw560/560-mesh:edge"
  public_url: &public_url "https://mesh.example.com"
  # 仅用于首次初始化；已有 DNS 设置请在管理台修改，升级时保留原值。
  magic_dns: &magic_dns "false"
  base_domain: &base_domain ""
  admin_username: &admin_username "admin560"
  admin_password: &admin_password "CHANGE_ME_BEFORE_START"
  admin_port: &admin_port "127.0.0.1:56011:3000"
  headscale_port: &headscale_port "127.0.0.1:56012:8080"

services:
  initialize:
    image: *image
    pull_policy: missing
    restart: "no"
    init: true
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m,mode=1777
    environment:
      PUBLIC_URL: *public_url
      BASE_DOMAIN: *base_domain
      MAGIC_DNS: *magic_dns
      ADMIN_USERNAME: *admin_username
      ADMIN_PASSWORD: *admin_password
    volumes:
      - ./config:/workspace/config
      - ./data:/workspace/data
      - ./data/headplane:/var/lib/headplane
    networks: [control_net]
    entrypoint: ["/nodejs/bin/node", "--input-type=module", "-e"]
    command:
      - |
        import * as fs from "node:fs/promises";
        import { spawn } from "node:child_process";
        import { lookup } from "node:dns/promises";
        import { initialize, validateAddress } from "/opt/560-platform/initialize.mjs";
        async function stat(path) {
          try { return await fs.lstat(path); }
          catch (error) { if (error.code === "ENOENT") return null; throw error; }
        }
        async function admin(operation, username, password) {
          return await new Promise((resolve, reject) => {
            const args = ["/app/build/cli/admin.mjs", operation];
            if (username) args.push(username);
            const child = spawn("/nodejs/bin/node", args, {
              uid: 65532, gid: 65532,
              env: { ...process.env, HEADPLANE_CONFIG_PATH: "/workspace/config/headplane/config.yaml" },
              stdio: ["pipe", "pipe", "pipe"]
            });
            let output = "";
            child.stdout.on("data", value => { output += value; });
            child.stderr.on("data", () => {});
            child.once("error", reject);
            child.once("close", code => {
              if (code === 0) resolve(output);
              else reject(new Error("管理员初始化失败；请检查账号、密码格式及数据目录权限。"));
            });
            child.stdin.on("error", () => {});
            child.stdin.end(password || "");
          });
        }
        async function updateConfig(path, fields) {
          const info = await stat(path);
          if (!info) return;
          if (!info.isFile() || info.isSymbolicLink() || info.nlink !== 1)
            throw new Error("配置文件类型异常，拒绝覆盖：" + path);
          let content = await fs.readFile(path, "utf8");
          for (const [key, value] of Object.entries(fields)) {
            let count = 0;
            content = content.split("\n").map(line => {
              const trimmed = line.trimStart();
              if (!trimmed.startsWith(key + ":")) return line;
              count++;
              return line.slice(0, line.length - trimmed.length) + key + ": " + JSON.stringify(value);
            }).join("\n");
            if (count !== 1) throw new Error("配置字段不唯一或缺失，拒绝覆盖：" + key);
          }
          const before = await fs.readFile(path, "utf8");
          if (content !== before) {
            const temporary = path + ".compose-init-" + process.pid;
            try {
              await fs.writeFile(temporary, content, { flag: "wx", mode: 0o600 });
              await fs.chown(temporary, 65532, 65532);
              await fs.rename(temporary, path);
            } finally { await fs.unlink(temporary).catch(() => {}); }
          }
          await fs.chmod(path, 0o600);
          await fs.chown(path, 65532, 65532);
        }
        try {
          if (!["true", "false"].includes(process.env.MAGIC_DNS)) throw new Error("magic_dns 必须是 true 或 false。");
          const magicDNS = process.env.MAGIC_DNS === "true";
          const publicUrl = validateAddress(process.env.PUBLIC_URL, process.env.BASE_DOMAIN, magicDNS);
          const baseDomain = process.env.BASE_DOMAIN.toLowerCase();
          const username = (process.env.ADMIN_USERNAME || "").trim().toLowerCase();
          const password = process.env.ADMIN_PASSWORD || "";
          const letters = "abcdefghijklmnopqrstuvwxyz";
          const allowed = letters + "0123456789_.-";
          if (username.length < 3 || username.length > 32 || !letters.includes(username[0]) || [...username].some(c => !allowed.includes(c)))
            throw new Error("管理员账号须为3至32位，以字母开头，仅含字母、数字及_.-；会自动转为小写。");
          if (password.startsWith("CHANGE_ME") || password.length < 12 || password.length > 128 || Buffer.byteLength(password, "utf8") > 512 ||
              ["\n", "\r", "\0"].some(c => password.includes(c)))
            throw new Error("请先在YAML顶部修改ADMIN_PASSWORD对应的admin_password，设置12至128字符、UTF-8不超过512字节的密码。");
          let timer;
          try {
            const addresses = await Promise.race([
              lookup(new URL(publicUrl).hostname, { all: true }),
              new Promise((_, reject) => { timer = setTimeout(() => reject(new Error("DNS timeout")), 3000); })
            ]);
            console.log("[initialize] 域名解析：" + addresses.map(a => a.address).join(", "));
          } catch {
            console.log("[initialize] 域名尚未解析或查询超时；继续初始化，DNS/HTTPS/Nginx请手工配置。");
          } finally { clearTimeout(timer); }
          for (const name of ["config", "data", "config/headscale", "config/headplane", "data/headscale", "data/headplane"]) {
            const path = "/workspace/" + name;
            const info = await stat(path);
            if (info && (!info.isDirectory() || info.isSymbolicLink()))
              throw new Error("数据目录类型异常：" + name);
            if (!info) await fs.mkdir(path, { mode: 0o700 });
            await fs.chmod(path, 0o700);
            await fs.chown(path, 65532, 65532);
          }
          await updateConfig("/workspace/config/headscale/config.yaml", { server_url: publicUrl });
          await updateConfig("/workspace/config/headplane/config.yaml", { base_url: publicUrl, public_url: publicUrl });
          await initialize({ root: "/workspace", publicUrl, baseDomain, magicDNS });
          const listed = await admin("list");
          if (listed.split("\n").some(line => line.split("\t")[0] === username)) {
            console.log("[initialize] 管理员已存在，保留原密码。");
          } else {
            await admin("create", username, password);
            console.log("[initialize] 管理员已创建：" + username);
          }
          console.log("[initialize] 初始化完成。仅配置本项目，未操作Nginx或FRP。");
        } catch (error) {
          console.error("[initialize] " + error.message);
          process.exitCode = 1;
        }

  platform:
    image: *image
    pull_policy: missing
    depends_on:
      initialize:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    environment:
      PUBLIC_URL: *public_url
      BASE_DOMAIN: *base_domain
      MAGIC_DNS: *magic_dns
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m,uid=65532,gid=65532,mode=1770
      - /var/run/headscale:rw,nosuid,noexec,size=8m,uid=65532,gid=65532,mode=0700
    ports:
      - *admin_port
      - *headscale_port
    volumes:
      - ./config/headscale:/etc/headscale:ro
      - ./config/headplane:/etc/headplane:ro
      - ./data/headscale:/var/lib/headscale
      - ./data/headplane:/var/lib/headplane
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [control_net]

networks:
  control_net:
    driver: bridge
