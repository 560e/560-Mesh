name: Publish Docker Hub image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag, for example edge or 1.2.0-dev.3"
        required: true
        default: edge
        type: string
      publish_latest:
        description: "Also update latest"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: dockerhub-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Validate release logic and platform
        working-directory: headscale
        run: npm test
      - name: Validate Docker Hub settings and image tags
        id: config
        env:
          DOCKERHUB_USERNAME: '${{ vars.DOCKERHUB_USERNAME }}'
          DOCKERHUB_TOKEN: '${{ secrets.DOCKERHUB_TOKEN }}'
          EVENT_NAME: '${{ github.event_name }}'
          REF_TYPE: '${{ github.ref_type }}'
          REF_NAME: '${{ github.ref_name }}'
          INPUT_IMAGE_TAG: '${{ inputs.image_tag }}'
          INPUT_PUBLISH_LATEST: '${{ inputs.publish_latest }}'
        run: node .github/scripts/dockerhub-config.mjs
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: '${{ steps.config.outputs.username }}'
          password: '${{ secrets.DOCKERHUB_TOKEN }}'
      - name: Build and push Linux amd64 image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: head-docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: '${{ steps.config.outputs.tags }}'
          labels: |
            org.opencontainers.image.title=560-Mesh
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.config.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=560-mesh-amd64
          cache-to: type=gha,mode=max,scope=560-mesh-amd64
      - name: Publication summary
        env:
          MESH_IMAGE_TAGS: '${{ steps.config.outputs.tags }}'
          MESH_IMAGE_DIGEST: '${{ steps.build.outputs.digest }}'
        run: |
          {
            echo "## Docker Hub image published"
            echo
            echo "Platform: linux/amd64"
            echo
            printf '%s\n' "$MESH_IMAGE_TAGS"
            echo
            printf 'Digest: %s\n' "$MESH_IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
